<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Elo</title>
<style>
:root{
  --bg:#F2F5EE; --surface:#FFFFFF; --ink:#14211A; --mute:#5E6F64; --line:#CBD6CB;
  --accent:#E9601C; --accent-ink:#FFFFFF; --pos:#1B7A44; --neg:#B23A26;
  --lt-bg:#FFFFFF; --lt-ink:#14211A; --lt-line:#14211A;
  --dk-bg:#17402F; --dk-ink:#FFFFFF; --dk-line:#17402F;
  --display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue Condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1812; --surface:#16241C; --ink:#E8EFE9; --mute:#93A69A; --line:#2B3E33;
    --accent:#F57A35; --accent-ink:#1A0D04; --pos:#5BCB8A; --neg:#F08A74;
    --lt-bg:#E8EFE9; --lt-ink:#14211A; --lt-line:#E8EFE9;
    --dk-bg:#050C08; --dk-ink:#E8EFE9; --dk-line:#5A7565;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
#app{max-width:640px;margin:0 auto;padding:12px 14px 60px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.2px}
h1{font-size:30px}
h2{font-size:22px;margin-bottom:8px}
h3{font-size:18px;margin:18px 0 6px}
.mute{color:var(--mute)} .small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 0 10px}
.saved{font-size:12px;color:var(--mute)}
.ver{font-family:var(--body);font-size:12px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:2px}
.top .right{display:flex;align-items:center;gap:8px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:1 0 auto;background:none;border:none;padding:10px 8px;font-family:var(--display);font-size:16px;font-weight:700;color:var(--mute);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.row .rk{width:26px;font-family:var(--display);font-size:20px;color:var(--mute);text-align:right}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{text-align:right}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.row .rt .num{font-size:28px;line-height:1}
.delta{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.prov{font-style:italic}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.cards button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;text-align:left}
.cards button.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.cards .num{font-size:30px;display:block;line-height:1.05}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:12px 18px;font-weight:700;font-size:17px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line);font-weight:600;font-size:15px;padding:9px 14px}
.btn.full{width:100%}
.btn.warn{background:var(--neg);color:#fff}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.chip{border:2px dashed var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;min-height:56px}
.chip b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{font-size:12px;opacity:.75}
.chip.lt{background:var(--lt-bg);color:var(--lt-ink);border:2px solid var(--lt-line)}
.chip.dk{background:var(--dk-bg);color:var(--dk-ink);border:2px solid var(--dk-line)}
.sides{display:flex;gap:14px;font-size:14px;margin:4px 0 0}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.sw.lt{background:var(--lt-bg);border:2px solid var(--lt-line)} .sw.dk{background:var(--dk-bg);border:2px solid var(--dk-line)}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:2px solid var(--line);margin:8px 0}
.bar div{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;min-width:44px}
.bar .l{background:var(--lt-bg);color:var(--lt-ink)} .bar .d{background:var(--dk-bg);color:var(--dk-ink)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.step{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{width:44px;height:52px;border:none;background:none;font-size:24px;font-weight:700}
.step input{width:100%;min-width:0;border:none;background:none;text-align:center;font-family:var(--display);font-size:32px;font-weight:700;color:var(--ink);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.lbl{font-weight:600;font-size:14px;margin-bottom:4px;display:flex;align-items:center}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px;width:100%}
.add{display:flex;gap:8px;margin-top:6px}
.msg{padding:10px 12px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:10px;font-weight:600}
.msg.err{border-color:var(--neg);color:var(--neg)}
.warnline{color:var(--neg);font-size:14px;font-weight:600}
.back{background:none;border:none;color:var(--mute);padding:4px 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.game{padding:12px 0;border-bottom:1px solid var(--line)}
.game .hd{display:flex;justify-content:space-between;align-items:baseline}
.game .sc{font-family:var(--display);font-size:24px;font-weight:700}
.game .gb{display:flex;gap:6px}
.game .hd{gap:8px}
input.se{width:56px;padding:4px 2px;text-align:center;font-family:var(--display);font-size:24px;font-weight:700;border-radius:8px}
.game .tm{font-size:14px;margin-top:2px}
.game .w{font-weight:700}
.date{font-family:var(--display);font-size:16px;color:var(--mute);margin:16px 0 0;padding-bottom:2px;border-bottom:2px solid var(--line)}
.insight{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
svg.chart{width:100%;height:auto;display:block}
.chart .base{stroke:var(--line);stroke-dasharray:4 4}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent)}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:8px 0}
label.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.lrow .nm{flex:1;min-width:0}.lrow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.lsel{display:flex;gap:8px}
.lb{width:52px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-size:22px;font-weight:700;color:var(--mute)}
.lb.o{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lb.d{background:var(--dk-bg);border-color:var(--dk-line);color:var(--dk-ink)}
.counts{display:flex;gap:16px;font-size:15px;padding:6px 0;border-bottom:2px solid var(--line)}
.counts b{font-family:var(--display);font-size:20px}
.rrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.rrow .tog{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;padding:10px 4px}
.rrow .nm{min-width:0}.rrow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.box{width:28px;height:28px;flex:none;border:2px solid var(--mute);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.box.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.box.out{background:var(--neg);border-color:var(--neg);color:#fff}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
.fmts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 8px}
.fmts button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fmts .num{font-size:22px}
.fmts .small{font-size:12px;color:var(--mute)}
.fmts button.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.fmts button.off{opacity:.5}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcol{border-radius:10px;padding:10px}
.tcol.lt{background:var(--lt-bg);color:var(--lt-ink);border:2px solid var(--lt-line)}
.tcol.dk{background:var(--dk-bg);color:var(--dk-ink);border:2px solid var(--dk-line)}
.tcol .th{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid currentColor;opacity:.9;padding-bottom:4px;margin-bottom:4px}
.tcol .th b{font-family:var(--display);font-size:20px}
.tcol .tp{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:16px}
.tcol .tp span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tcol .tp .num{font-size:16px;opacity:.75}
.tcol .subrow{font-size:15px}
.tcol.neutral{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.tcol .pbtn{display:flex;width:100%;background:none;border:none;color:inherit;font:inherit;text-align:left;border-radius:6px;padding:7px 4px;min-height:38px;cursor:pointer;justify-content:space-between;gap:8px}
.tcol .pbtn.sel{background:var(--accent);color:var(--accent-ink)}
.tcol .pbtn.sel .num{opacity:1}
.tcol .move{display:block;margin:2px 0 4px;font-size:14px}
.match{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.match .w{font-weight:700}
.match .ms{font-family:var(--display);font-size:20px;font-weight:700}
.seg button.warn{background:var(--neg);color:#fff;border-color:var(--neg)}
.tcol .subrow:first-of-type{}
.subtag{font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;opacity:.8;vertical-align:1px}
.fmts button{min-height:74px}
.btn.sm{padding:6px 10px;font-size:14px;flex:none}
.btn.sm.on{border-color:var(--neg);color:var(--neg)}
.rrow.hurt .nm b{text-decoration:line-through;opacity:.7}
.rrow.hurt .box{opacity:.35}
.rrow .tog:disabled{cursor:default}
@media (prefers-reduced-motion:no-preference){.bar div{transition:flex-basis .25s}}
</style>

<body>
<div id="app"></div>
<script>
const APP_VERSION='v1.7';
const KEY='ultimate-elo:v1';
const CATS=['overall','3v3','5v5','7v7'];
const CATNAME={overall:'Overall','3v3':'3v3','5v5':'5v5','7v7':'7v7'};
let S={players:[],games:[],settings:{k:32,start:1000,mov:true},out:{},hereDate:'',injured:{},lines:{},night:null};
let UI={tab:'board',cat:'overall',pid:null,pcat:'overall',assign:{},tn:0,tg:0,tm:null,lf:7,field:0,sel:null,rrn:3,rrt:0,rredit:false,rract:0,pendingM:null,sA:0,sB:0,confirm:null,msg:'',err:false,editG:null,sync:'loading',unlock:false,lockMsg:'',imp:''};
let P=null;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=id=>document.getElementById(id);
const pname=id=>{const p=S.players.find(p=>p.id===id);return p?p.name:'(removed)'};
const catFor=n=>n===3?'3v3':n===5?'5v5':n===7?'7v7':'overall';

/* ---------- shared storage (Supabase) ---------- */
const SB_URL='https://ggesapuymmsdwrdphcgf.supabase.co';
const SB_KEY='sb_publishable_LaDLspYK52C-MaruN7dttA_OEwwkDeR'; // publishable key: safe to be public
const PASS_KEY='ulti-elo-pass', CACHE_KEY='ulti-elo-cache', OLD_KEY='ultimate-elo:v1';
let V=0, PASS=null, loaded=false, saving=false, dirty=false;
const today=()=>new Date().toLocaleDateString('en-CA');
const isHere=p=>!S.out[p.id]&&!S.injured[p.id];
function normalize(d){
  d=d||{};
  const n={players:d.players||[],games:d.games||[],settings:Object.assign({k:32,start:1000,mov:true},d.settings||{}),out:d.out||{},hereDate:d.hereDate||'',injured:d.injured||{},lines:d.lines||{},night:d.night||null};
  if(n.hereDate!==today()){n.out={};n.hereDate=today();} // "out today" resets each day
  if(n.night&&n.night.date!==today()) n.night=null; // tonight's teams reset each day
  return n;
}
async function rpc(name,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(body||{})});
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e;}
  return r.json();
}
function lsGet(k){try{return window.localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{window.localStorage.removeItem(k);}catch(e){}}
function setSync(v){UI.sync=v;const el=$('saved'); if(el) el.textContent=savedText();}
const savedText=()=>({loading:'Loading…',saving:'Saving…',offline:'Offline',setup:'Setup needed'}[UI.sync]||(PASS?'Synced · can edit':'View only'));
async function pull(){
  const r=await rpc('ulti_get');
  if(!r||typeof r.version!=='number') throw new Error('bad response');
  V=r.version; S=normalize(r.data); lsSet(CACHE_KEY,JSON.stringify(r));
}
function save(){ if(!PASS) return; dirty=true; if(!saving) flush(); }
async function flush(){
  saving=true; setSync('saving');
  while(dirty){
    dirty=false; S.hereDate=today();
    try{
      const r=await rpc('ulti_save',{p_pass:PASS,p_data:S,p_version:V});
      if(r.ok){ V=r.version; lsSet(CACHE_KEY,JSON.stringify({data:S,version:V})); setSync('ok'); }
      else if(r.error==='bad_passcode'){
        PASS=null; lsDel(PASS_KEY); await pull().catch(()=>{}); compute();
        UI.unlock=true; UI.lockMsg='The passcode was not accepted, so that change was not saved.'; setSync('ok'); render();
      }else if(r.error==='conflict'){
        await pull(); compute(); setSync('ok');
        UI.msg='Someone else just updated the data, so your last change was not saved. The latest is loaded. Please redo it.'; UI.err=true; render();
      }
    }catch(e){
      setSync('offline'); UI.msg='Could not reach the server, so that change was not saved.'; UI.err=true;
      await pull().then(()=>{compute();setSync('ok');}).catch(()=>{}); render();
    }
  }
  saving=false;
}
function canEdit(){
  if(!loaded){UI.msg='Still connecting to the team database. Try again in a moment.';UI.err=true;render();return false;}
  if(PASS) return true;
  UI.unlock=true; UI.lockMsg=''; render(); return false;
}
async function tryUnlock(){
  const v=($('pw').value||'').trim(); if(!v) return;
  try{
    // a save with a wrong passcode is refused, a conflict means the passcode was right
    const r=await rpc('ulti_save',{p_pass:v,p_data:S,p_version:V});
    if(!r.ok&&r.error==='bad_passcode'){UI.lockMsg='That passcode is not right. It is case-sensitive.';render();return;}
    if(r.ok) V=r.version; else { await pull(); compute(); }
    PASS=v; lsSet(PASS_KEY,v); UI.unlock=false; UI.lockMsg=''; UI.msg='Unlocked. This phone can make changes now.'; UI.err=false; setSync('ok'); render();
  }catch(e){UI.lockMsg='Could not reach the server. Check your connection.';render();}
}
function forgetPass(){PASS=null;lsDel(PASS_KEY);UI.unlock=false;UI.msg='This phone is now view-only.';UI.err=false;setSync('ok');render();}
async function poll(){
  if(saving||!loaded) return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return; // don't wipe what someone is typing
  try{
    const r=await rpc('ulti_get');
    if(r.version!==V){ V=r.version; S=normalize(r.data); lsSet(CACHE_KEY,JSON.stringify(r)); compute(); render(); }
    if(UI.sync==='offline') setSync('ok');
  }catch(e){ setSync('offline'); }
}
function oldData(){
  try{const t=lsGet(OLD_KEY); if(!t) return null; const d=JSON.parse(t); return d.players&&d.players.length?d:null;}catch(e){return null;}
}
function importOld(){
  if(!canEdit()) return;
  if(UI.confirm!=='old'){UI.confirm='old';return render();}
  S=normalize(oldData()); UI.confirm=null; compute(); save(); UI.msg='Copied this phone\'s old ratings into the team database.'; UI.err=false; render();
}
function accessHtml(){
  const old=oldData();
  return `<h3>Team access</h3>
  <p class="small">${PASS?'This phone can log games and edit the roster.':'This phone is view-only. Everyone sees the same live ratings, roster and games.'}</p>
  <p>${PASS?`<button class="btn ghost" onclick="forgetPass()">Lock this phone</button>`:`<button class="btn ghost" onclick="UI.unlock=true;UI.lockMsg='';render()">Unlock to edit</button>`}</p>
  ${old?`<p class="small mute">This phone still has ratings saved from the earlier single-phone version (${old.players.length} players, ${(old.games||[]).length} games).</p><p><button class="btn ghost ${UI.confirm==='old'?'warn':''}" onclick="importOld()">${UI.confirm==='old'?'Tap again to replace the team data':'Copy them into the team database'}</button></p>`:''}`;
}

/* ---------- Elo engine (everything is recomputed from the game list) ---------- */
function compute(){
  const {k,mov,start}=S.settings;
  const R={},N={},H={},ST={},D={};
  S.players.forEach(p=>{
    R[p.id]={};N[p.id]={};H[p.id]={};
    CATS.forEach(c=>{R[p.id][c]=start;N[p.id][c]=0;H[p.id][c]=[start];});
    ST[p.id]={rec:{},mates:{},opps:{}};
    CATS.forEach(c=>{ST[p.id].rec[c]={w:0,l:0,t:0,pf:0,pa:0};ST[p.id].mates[c]={};ST[p.id].opps[c]={};});
  });
  const games=[...S.games].sort((a,b)=>a.t-b.t);
  for(const g of games){
    if(![...g.A,...g.B].every(i=>R[i])) continue;
    const n=g.n||g.A.length, fmt=n+'v'+n; // n = players on the field per side, which can be smaller than the roster
    const cats=['overall']; if(CATS.includes(fmt)) cats.push(fmt);
    const res=g.sA>g.sB?1:g.sA<g.sB?0:0.5;
    const margin=Math.abs(g.sA-g.sB), top=Math.max(g.sA,g.sB)||1;
    const mult=mov?1+0.5*margin/top:1;
    D[g.id]={};
    for(const c of cats){
      const avg=ids=>ids.reduce((s,i)=>s+R[i][c],0)/ids.length;
      const eA=1/(1+Math.pow(10,(avg(g.B)-avg(g.A))/400));
      const upd=(ids,e,s)=>ids.forEach(i=>{
        const d=(N[i][c]<10?1.5:1)*k*mult*(s-e);
        R[i][c]+=d; N[i][c]++; H[i][c].push(R[i][c]);
        (D[g.id][i]=D[g.id][i]||{})[c]=d;
      });
      upd(g.A,eA,res); upd(g.B,1-eA,1-res);
      // records
      const rec=(mine,theirs,s,pf,pa)=>mine.forEach(i=>{
        const r=ST[i].rec[c]; r.pf+=pf; r.pa+=pa; if(s===1)r.w++; else if(s===0)r.l++; else r.t++;
        const bump=(map,o)=>{const m=map[o]=map[o]||{w:0,l:0,t:0}; if(s===1)m.w++; else if(s===0)m.l++; else m.t++;};
        mine.forEach(o=>{ if(o!==i) bump(ST[i].mates[c],o); });
        theirs.forEach(o=>bump(ST[i].opps[c],o));
      });
      rec(g.A,g.B,res,g.sA,g.sB); rec(g.B,g.A,1-res,g.sB,g.sA);
    }
  }

}
// use the format rating once someone has 3+ games in it, otherwise fall back to overall
const effR=(id,c)=>(c!=='overall'&&P.N[id][c]>=3)?P.R[id][c]:P.R[id].overall;
const pct=(w,l,t)=>{const g=w+l+t;return g?Math.round((w+t/2)/g*100):0};
const recStr=r=>`${r.w}-${r.l}${r.t?'-'+r.t:''}`;

function balance(ids){
  const n=ids.length;
  if(n<2||n%2) return null;
  if(n>16) return 'big';
  const c=catFor(n/2), half=n/2;
  const r=ids.map(i=>effR(i,c)), total=r.reduce((a,b)=>a+b,0);
  const out=[];
  for(let m=1;m<(1<<n);m+=2){ // player 0 always on Light, avoids mirrored duplicates
    let cnt=0,sum=0;
    for(let b=0;b<n;b++) if(m&(1<<b)){cnt++;sum+=r[b];}
    if(cnt!==half) continue;
    out.push({m,diff:Math.abs(2*sum-total)/half});
  }
  out.sort((a,b)=>a.diff-b.diff);
  const best=out[0].diff, near=out.filter(o=>o.diff<=best+4);
  const pick=near[Math.floor(Math.random()*near.length)];
  const A=[],B=[];
  ids.forEach((id,b)=>(pick.m&(1<<b)?A:B).push(id));
  return {A,B};
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function partition(ids,t,n,c){ // split into t teams of n whose total ratings are as close as possible
  const r=id=>effR(id,c), total=ids.reduce((x,i)=>x+r(i),0), mean=total/t, sols=[];
  for(let rs=0;rs<30;rs++){
    const sh=shuffle([...ids]), teams=Array.from({length:t},(_,k)=>sh.slice(k*n,(k+1)*n));
    const sums=teams.map(tm=>tm.reduce((x,i)=>x+r(i),0));
    let improved=true;
    while(improved){
      improved=false;
      for(let a=0;a<t;a++)for(let b=a+1;b<t;b++)for(let i=0;i<n;i++)for(let j=0;j<n;j++){
        const ra=r(teams[a][i]), rb=r(teams[b][j]), na=sums[a]-ra+rb, nb=sums[b]-rb+ra;
        const d=(na-mean)**2+(nb-mean)**2-(sums[a]-mean)**2-(sums[b]-mean)**2;
        if(d<-1e-9){const x=teams[a][i];teams[a][i]=teams[b][j];teams[b][j]=x;sums[a]=na;sums[b]=nb;improved=true;}
      }
    }
    sols.push({teams,spread:(Math.max(...sums)-Math.min(...sums))/n});
  }
  sols.sort((x,y)=>x.spread-y.spread);
  const near=sols.filter(x=>x.spread<=sols[0].spread+2);
  return near[Math.floor(Math.random()*near.length)].teams;
}
function rrCount(n,custom){const avail=S.players.filter(isHere).length,maxT=Math.floor(avail/n);return {avail,maxT,t:custom?(UI.rrt||Math.max(2,maxT)):(UI.rrt?Math.min(UI.rrt,maxT):maxT)};}
function makeRR(){
  if(!canEdit()) return;

  if(maxT<2){UI.msg=`Round robin needs at least ${2*n} players for teams of ${n}.`;UI.err=true;return render();}
  const c=catFor(n), pool=shuffle(S.players.filter(isHere).map(p=>p.id));
  pool.sort((a,b)=>effR(b,c)-effR(a,c));
  const starters=pool.slice(0,t*n), extras=pool.slice(t*n);
  const teams=partition(starters,t,n,c).map(pl=>({players:pl,subs:[]}));
  const avg=tm=>tm.players.reduce((x,i)=>x+effR(i,c),0)/tm.players.length;
  [...extras].sort((a,b)=>effR(b,c)-effR(a,c)).forEach(i=>{ // extras join as subs, weakest teams first
    const idx=teams.map((_,k)=>k).sort((x,y)=>teams[x].subs.length-teams[y].subs.length||avg(teams[x])-avg(teams[y]));
    teams[idx[0]].subs.push(i);

  const id=uid();
  S.night={id,date:today(),n,src:'elo',teams:teams.map((tm,k)=>({id:id+'-'+(k+1),name:'Team '+(k+1),players:tm.players,subs:tm.subs}))};

}

function rrSchedule(T){ // circle method: everyone plays everyone once, odd counts get a bye
  const arr=[...Array(T).keys()]; if(T%2) arr.push(-1);
  const m=arr.length, rounds=[];
  for(let r=0;r<m-1;r++){
    const pairs=[],bye=[];
    for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i]; if(a<0)bye.push(b); else if(b<0)bye.push(a); else pairs.push([a,b]);}
    rounds.push({pairs,bye}); arr.splice(1,0,arr.pop());
  }

}

function chart(h,start){
  if(h.length<2) return '<div class="mute small" style="padding:14px 0">Play a game to start the rating chart.</div>';
  const w=320,ht=110,pad=8, mn=Math.min(...h,start)-10, mx=Math.max(...h,start)+10;
  const x=i=>pad+i*(w-2*pad)/(h.length-1), y=v=>ht-pad-(v-mn)/(mx-mn)*(ht-2*pad);
  const pts=h.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${ht}" role="img" aria-label="Rating over time">
    <line class="base" x1="${pad}" x2="${w-pad}" y1="${y(start)}" y2="${y(start)}"/>
    <polyline class="ln" points="${pts}"/><circle class="dot" cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="4"/></svg>`;
}

  const ins=[];
  if(n){
    const g=rec.w+rec.l+rec.t, pd=(rec.pf-rec.pa)/g;
    ins.push(`Win rate <b>${pct(rec.w,rec.l,rec.t)}%</b> across ${g} game${g===1?'':'s'}. Average point margin <b class="${pd>=0?'pos':'neg'}">${pd>=0?'+':''}${pd.toFixed(1)}</b> per game.`);
    const mates=Object.entries(st.mates[c]).map(([o,r])=>({o,r,g:r.w+r.l+r.t,p:pct(r.w,r.l,r.t)})).filter(x=>x.g>=2).sort((a,b)=>b.p-a.p||b.g-a.g);
    if(mates.length) ins.push(`Best teammate: <b>${esc(pname(mates[0].o))}</b> (${recStr(mates[0].r)}, ${mates[0].p}%).`+(mates.length>1&&mates[mates.length-1].p<mates[0].p?` Toughest pairing: <b>${esc(pname(mates[mates.length-1].o))}</b> (${mates[mates.length-1].p}%).`:''));
    const opps=Object.entries(st.opps[c]).map(([o,r])=>({o,r,g:r.w+r.l+r.t,p:pct(r.w,r.l,r.t)})).filter(x=>x.g>=2).sort((a,b)=>a.p-b.p||b.g-a.g);
    if(opps.length) ins.push(`Hardest opponent: <b>${esc(pname(opps[0].o))}</b> (${recStr(opps[0].r)} against).`);
  }
  const fm=['3v3','5v5','7v7'].filter(k=>P.N[id][k]>=3);
  if(fm.length>=2){
    const srt=[...fm].sort((a,b)=>P.R[id][b]-P.R[id][a]), d=P.R[id][srt[0]]-P.R[id][srt[srt.length-1]];
    ins.push(d<15?`Rated about the same in ${fm.join(', ')}.`:`Strongest in <b>${srt[0]}</b>, weakest in <b>${srt[srt.length-1]}</b> (${Math.round(d)} points apart).`);
  }
  const ratingNote=n&&n<5?`<p class="small mute prov">Provisional: ratings move faster for the first 10 games in each format.</p>`:'';
  return `<button class="back" onclick="UI.pid=null;render()">&larr; Ratings</button>
    <h2>${esc(p.name)}</h2>
    <div class="cards">${cards}</div>
    ${n?chart(P.H[id][c],S.settings.start):`<p class="mute">No ${CATNAME[c]} games yet.</p>`}
    ${ratingNote}
    ${ins.length?`<h3>What the games say</h3>`+ins.map(t=>`<div class="insight">${t}</div>`).join(''):''}
    ${table(st.mates[c],'With teammates')}
    ${table(st.opps[c],'Against opponents')}
    <h3>Edit player</h3>
    <div class="add"><input type="text" id="rn" value="${esc(p.name)}" aria-label="Player name"><button class="btn ghost" onclick="renamePlayer('${id}')">Rename</button></div>
    <p style="margin-top:10px">${S.games.some(g=>g.A.includes(id)||g.B.includes(id))
      ?'<span class="small mute">Delete this player\'s games to remove them from the roster.</span>'
      :`<button class="btn ghost ${UI.confirm==='p'+id?'warn':''}" onclick="delPlayer('${id}')">${UI.confirm==='p'+id?'Tap again to delete':'Remove from roster'}</button>`}</p>`;
}

  const order=T.map((_,k)=>k).sort((a,b)=>res.stand[b].w-res.stand[a].w||(res.stand[b].pf-res.stand[b].pa)-(res.stand[a].pf-res.stand[a].pa));
  h+=`<h3>Standings</h3>${res.count?`<table><tr><th>Team</th><th class="r">W-L</th><th class="r">Pts +/-</th></tr>${order.map(k=>{const st=res.stand[k],d=st.pf-st.pa;return `<tr><td>${nm(k)}</td><td class="r">${st.w}-${st.l}${st.t?'-'+st.t:''}</td><td class="r ${d>0?'pos':d<0?'neg':''}">${d>0?'+':''}${d}</td></tr>`;}).join('')}</table>`:`<p class="small mute">Standings appear after the first game is logged.</p>`}
  <h3>Manage</h3>
  <div class="seg"><button onclick="rrEdit()">Rebuild by hand</button><button class="${UI.confirm==='rrmake'?'warn':''}" onclick="rrRemake()">${UI.confirm==='rrmake'?'Tap again: remake and reset results':'Remake balanced'}</button><button class="${UI.confirm==='rrclear'?'warn':''}" onclick="rrClear()">${UI.confirm==='rrclear'?'Tap again to clear':'Clear tonight'}</button></div>
  <p class="small mute">Teams stay the same until tomorrow, on every phone, and the Elo Teams and Custom Teams tabs show the same set. Games logged from the schedule count toward ratings like any other game.</p>`;

  h+=`<div class="scores">
    <div><div class="lbl"><span class="sw lt"></span>Light score</div><div class="step"><button onclick="step('A',-1)" aria-label="Light minus one">&minus;</button><input id="sA" type="number" inputmode="numeric" min="0" value="${UI.sA}" oninput="UI.sA=+this.value"><button onclick="step('A',1)" aria-label="Light plus one">+</button></div></div>
    <div><div class="lbl"><span class="sw dk"></span>Dark score</div><div class="step"><button onclick="step('B',-1)" aria-label="Dark minus one">&minus;</button><input id="sB" type="number" inputmode="numeric" min="0" value="${UI.sB}" oninput="UI.sB=+this.value"><button onclick="step('B',1)" aria-label="Dark plus one">+</button></div></div>
  </div>
  <button class="btn full" onclick="recordGame()">Record game</button>`;
  return h;
}

function vGames(){
  if(!S.games.length) return `<p class="mute">No games yet. Games you record show up here with each player's rating change.</p>`;
  const gs=[...S.games].sort((a,b)=>b.t-a.t); let last='',h='';
  for(const g of gs){
    const d=new Date(g.t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    if(d!==last){h+=`<div class="date">${d}</div>`;last=d;}
    const n=g.n||g.A.length, c=catFor(n), aw=g.sA>g.sB, bw=g.sB>g.sA, D=P.D[g.id]||{};
    const names=(ids,win)=>ids.map(i=>{const dl=D[i]&&D[i].overall; return `${esc(pname(i))}${dl!=null?` <span class="delta ${dl>=0?'pos':'neg'}">${dl>=0?'+':''}${dl.toFixed(0)}</span>`:''}`;}).join(', ');
    const ed=UI.editG===g.id;
    const score=ed?`<span class="sc"><input id="eA" class="se" type="number" inputmode="numeric" min="0" value="${g.sA}" aria-label="Light score"> &ndash; <input id="eB" class="se" type="number" inputmode="numeric" min="0" value="${g.sB}" aria-label="Dark score"></span>`:`<span class="sc">${g.sA} &ndash; ${g.sB}</span>`;
    const btns=ed?`<span class="gb"><button class="btn sm" onclick="saveGame('${g.id}')">Save</button><button class="btn ghost sm" onclick="cancelEdit()">Cancel</button></span>`
      :`<span class="gb"><button class="btn ghost sm" onclick="editGame('${g.id}')">Edit</button><button class="btn ghost sm ${UI.confirm==='g'+g.id?'warn':''}" onclick="delGame('${g.id}')">${UI.confirm==='g'+g.id?'Tap again':'Delete'}</button></span>`;
    h+=`<div class="game"><div class="hd"><span class="small mute">${n}v${n}${g.A.length!==g.B.length||g.A.length!==n?`<br>${g.A.length} vs ${g.B.length}`:''}</span>${score}${btns}</div>
      <div class="tm ${aw?'w':''}"><span class="sw lt"></span>${names(g.A)}</div>
      <div class="tm ${bw?'w':''}"><span class="sw dk"></span>${names(g.B)}</div>${ed?'<div class="small mute" style="margin-top:6px">Light first, Dark second. Saving recalculates every rating.</div>':''}</div>`;
  }
  return h+`<p class="small mute">Editing or deleting a game replays every rating from scratch, so the numbers stay consistent.</p>`;
}

function vData(){
  const s=S.settings;
  let h='';
  h+=`<h2>Rating settings</h2>
  <div class="set">
    <div><div class="lbl">K-factor</div><input type="number" value="${s.k}" min="1" onchange="setSetting('k',this.value)"></div>
    <div><div class="lbl">Starting rating</div><input type="number" value="${s.start}" min="1" onchange="setSetting('start',this.value)"></div>
  </div>
  <p class="small mute" style="margin-top:-4px">K-factor is how far one game moves ratings. 32 suits a small group. Each player's first 10 games in a format count 1.5x so ratings settle quickly.</p>
  <label class="chk"><input type="checkbox" ${s.mov?'checked':''} onchange="setSetting('mov',this.checked)"><span>Scale changes by score margin. A 7-1 win moves ratings up to 1.5x more than a 7-6 win.</span></label>
  <h3>How ratings work</h3>
  <p class="small">Each team's strength is the average rating of its players. The expected result comes from the gap between the two averages, and every player on a team gains or loses the same amount. Overall counts every game. The 3v3, 5v5 and 7v7 ratings only count games of that size, so you get a separate read on each format. Other sizes (4v4 and so on) still count toward Overall.</p>
  ${accessHtml()}
  <h3>Back up your data</h3>
  <p class="small mute">Copy this text somewhere safe. Paste it back below to restore.</p>
  <textarea readonly onclick="this.select()" aria-label="Exported data">${esc(JSON.stringify(S))}</textarea>
  <div class="lbl" style="margin-top:10px">Restore from backup</div>
  <textarea id="imp" placeholder="Paste exported data here" aria-label="Import data"></textarea>
  <p><button class="btn ghost" onclick="doImport()">Import</button></p>
  <h3>Start over</h3>
  <button class="btn ghost ${UI.confirm==='reset'?'warn':''}" onclick="resetAll()">${UI.confirm==='reset'?'Tap again to erase everything':'Erase all players and games'}</button>`;
  return h;
}

function render(){
  const scrollY=window.scrollY;
  const tabs=[['board','Ratings'],['roster','Roster'],['elo','Elo Teams'],['custom','Custom Teams'],['lines','Lines'],['log','Log'],['games','Games'],['data','Data']];
  let body = UI.tab==='board' ? (UI.pid?vPlayer():vBoard()) : UI.tab==='roster' ? vRoster() : UI.tab==='elo' ? vElo() : UI.tab==='custom' ? vCustom() : UI.tab==='lines' ? vLines() : UI.tab==='log' ? vLog() : UI.tab==='games' ? vGames() : vData();
  const unlock = UI.unlock&&!PASS ? `<div class="card" style="margin-bottom:12px"><div class="lbl">Team passcode</div>
    <div class="add"><input type="password" id="pw" placeholder="Passcode" autocomplete="off" aria-label="Team passcode" onkeydown="if(event.key==='Enter')tryUnlock()"><button class="btn" onclick="tryUnlock()">Unlock</button></div>
    <p class="small mute" style="margin:8px 0 0">Anyone can look at the ratings. The passcode is only needed to log games or change the roster, and this phone will remember it. <button class="linkbtn" onclick="UI.unlock=false;UI.lockMsg='';render()">Cancel</button></p>
    ${UI.lockMsg?`<p class="warnline" style="margin:6px 0 0">${esc(UI.lockMsg)}</p>`:''}</div>` : '';
  const msg = UI.msg ? `<div class="msg ${UI.err?'err':''}" role="status">${esc(UI.msg)}</div>` : '';
  $('app').innerHTML=`<div class="top"><h1>Practice Elo <small class="ver">${APP_VERSION}</small></h1><span class="right"><span class="saved" id="saved">${savedText()}</span>${PASS?'':`<button class="btn ghost sm" onclick="UI.unlock=true;UI.lockMsg='';render()">Unlock</button>`}</span></div>
    <nav class="tabs">${tabs.map(([k,l])=>`<button class="${UI.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav>${unlock}${msg}${body}`;
  window.scrollTo(0,scrollY);
  if(UI.unlock&&!PASS&&$('pw')&&!$('pw').dataset.f){ $('pw').focus(); }
}

(async function init(){
  PASS=lsGet(PASS_KEY)||null;
  try{const c=JSON.parse(lsGet(CACHE_KEY)||'null'); if(c&&c.data){S=normalize(c.data);}}catch(e){}
  compute(); render();
  try{ await pull(); loaded=true; setSync('ok'); }
  catch(e){
    if(e.status===404||e.status===400){ setSync('setup'); UI.msg='The team database is not set up yet. Run the setup script in Supabase, then reload.'; }
    else { setSync('offline'); UI.msg='Could not reach the team database. Showing the last copy saved on this phone. Editing is off until it reconnects.'; }
    UI.err=true;
  }
  compute(); render();
  setInterval(poll,15000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(!loaded) pull().then(()=>{loaded=true;UI.msg='';setSync('ok');compute();render();}).catch(()=>{}); else poll(); } });
})();
</script>
</body>
</html>
